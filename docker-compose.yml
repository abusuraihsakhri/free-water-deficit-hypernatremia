version: '3.8'

services:
  free-water-deficit-hypernatremia:
    build: .
    container_name: free-water-deficit-hypernatremia
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=free-water-deficit-hypernatremia-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
